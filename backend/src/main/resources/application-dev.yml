# ===========================================================================
# ⚠️⚠️ 임시 파일 (2026-07-25) — 테스트 후 이 파일을 삭제한다 ⚠️⚠️
# ===========================================================================
# 주문 승인요청 시 재고 검증을 **무조건 실패**시켜, 제품별 인라인 에러 표시
# (ORD_PRODUCT_RESTRICTED + error.details.violations)를 dev 에서 항상 재현하기
# 위한 QA 스위치.
#
# - `dev` 프로파일에서만 로드되는 파일이므로 prod 는 이 값을 볼 수 없다
#   (코드측 placeholder 기본값도 false — application.yml 은 손대지 않았다).
# - 켜져 있는 동안 dev 에서는 주문 등록이 **전혀 되지 않는다**. 전 라인이
#   "공급제한수량 초과" 로 거부된다. 임시저장(OrderDraft)은 재고 검증을 타지
#   않으므로 정상 동작한다.
# - 재배포 없이 급히 끄려면 EB 환경 속성에
#   `APP_ORDER_DEBUG_FORCE_INVENTORY_VIOLATION=false` 를 설정한다.
#
# 되돌릴 때: 이 파일 삭제 + OrderRequestCreateService 의 `forceInventoryViolation`
# 파라미터/강제 실패 블록/`log` 필드/import 2개 + 테스트의 인자 1줄 제거.
# (커밋 단위로 분리해 두었으므로 해당 커밋 revert 로 일괄 원복 가능)
# ===========================================================================
app:
  order:
    debug:
      force-inventory-violation: true
